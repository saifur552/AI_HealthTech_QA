name: SQA Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov requests selenium pytest-html

    - name: Run All Tests and Generate Report
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python -m pytest tests/ --html=report.html --self-contained-html -v
      continue-on-error: true

    - name: Upload HTML Test Report
      uses: actions/upload-artifact@v4
      with:
        name: Automated-Test-Report
        path: report.html

    - name: Upload AI Bug Report
      uses: actions/upload-artifact@v4
      with:
        name: AI-Generated-Bug-Report
        path: AI_Bug_Report.txt